name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Usa o lockfile quando existir (commite o package-lock.json depois do primeiro npm install)
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Em Settings › Secrets and variables › Actions › Variables:
      #   VITE_DATA_SOURCE = api   e   VITE_API_URL = https://<sua-api>.up.railway.app
      # Sem as variáveis, o build usa a API sem URL -> estados vazios (nunca o mock).
      - name: Build
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_DATA_SOURCE" ]; then unset VITE_DATA_SOURCE; fi
          if [ -z "$VITE_API_URL" ]; then unset VITE_API_URL; fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
